<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daemon</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">
  <link rel="stylesheet" href="../styles.css">
  <script>
    try { var t = localStorage.getItem('lerncenter-theme'); } catch (e) {}
    document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
</head>
<body class="daemon">
  <header class="topbar">
    <div class="topbar-title" style="padding-left:.5rem">Daemon</div>
    <button class="iconbtn theme" aria-label="Light / Dark">◐</button>
  </header>
  <main class="home compact">
    <section class="hero">
      <h1>Daemon</h1>
      <p>Harmony, language and ideas to play with. Listen, try, understand.</p>
    </section>
    <section class="lesson-list" id="lessons"></section>
  </main>
  <script type="module">
    import { toggleTheme } from '../js/theme.js';
    import { catalog } from './lessons/index.js';
    document.querySelector('.theme').onclick = toggleTheme;

    // Grouped by subject, in catalog order, one compact row per lesson.
    const host = document.getElementById('lessons');
    const groups = new Map();
    for (const l of catalog) (groups.get(l.subject) || groups.set(l.subject, []).get(l.subject)).push(l);
    for (const [subject, list] of groups) {
      const sec = document.createElement('section');
      sec.className = 'group';
      sec.innerHTML = `<h2>${subject}<span class="count">${list.length}</span></h2>`;
      for (const l of list) {
        const row = document.createElement(l.available ? 'a' : 'div');
        row.className = `row${l.available ? '' : ' soon'}`;
        if (l.available) row.href = `lesson.html?id=${l.id}`;
        row.innerHTML = `<span class="title">${l.title}</span><span class="desc">${l.description}</span><span class="go" aria-hidden="true">${l.available ? '→' : 'soon'}</span>`;
        sec.appendChild(row);
      }
      host.appendChild(sec);
    }
  </script>
</body>
</html>
