<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daemon</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">
  <link rel="stylesheet" href="../styles.css">
  <script>
    try { var t = localStorage.getItem('lerncenter-theme'); } catch (e) {}
    document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
</head>
<body class="daemon">
  <header class="topbar">
    <div class="topbar-title" style="padding-left:.5rem">👾 Daemon</div>
    <button class="iconbtn theme" aria-label="Light / Dark">◐</button>
  </header>
  <main class="home">
    <section class="hero">
      <h1>Daemon</h1>
      <p>Harmony, sound and ideas to play with. Listen, try, understand – straight in the browser.</p>
    </section>
    <section class="filter" id="filter"></section>
    <section class="courses" id="courses"></section>
  </main>
  <script type="module">
    import { toggleTheme } from '../js/theme.js';
    import { catalog } from './lessons/index.js';
    document.querySelector('.theme').onclick = toggleTheme;

    const KEY_SUBJECT = 'daemon-subject';
    let subject = 'all';
    try { subject = localStorage.getItem(KEY_SUBJECT) || 'all'; } catch {}

    const filterEl = document.getElementById('filter');
    const coursesEl = document.getElementById('courses');
    const subjects = [...new Set(catalog.map((l) => l.subject))].sort((a, b) => a.localeCompare(b, 'en'));

    function renderFilter() {
      filterEl.innerHTML = '';
      if (subjects.length < 2) return; // one subject: nothing to filter yet
      const wrap = document.createElement('label');
      wrap.className = 'select';
      wrap.innerHTML = '<span class="label">Subject</span>';
      const sel = document.createElement('select');
      for (const o of [{ value: 'all', text: 'All subjects' }, ...subjects.map((s) => ({ value: s, text: s }))]) {
        const opt = document.createElement('option');
        opt.value = o.value; opt.textContent = o.text; opt.selected = o.value === subject;
        sel.appendChild(opt);
      }
      sel.onchange = () => { subject = sel.value; try { localStorage.setItem(KEY_SUBJECT, subject); } catch {} renderCourses(); };
      wrap.appendChild(sel);
      filterEl.appendChild(wrap);
    }

    function renderCourses() {
      const list = catalog.filter((l) => subject === 'all' || l.subject === subject);
      coursesEl.innerHTML = '';
      if (!list.length) {
        coursesEl.innerHTML = '<p class="empty-state">No lessons for this selection yet.</p>';
        return;
      }
      for (const l of list) {
        const el = document.createElement(l.available ? 'a' : 'div');
        el.className = `course ${l.color}${l.available ? '' : ' soon'}`;
        if (l.available) el.href = `lesson.html?id=${l.id}`;
        el.innerHTML = `
          <div class="art">${l.emoji}</div>
          <div class="meta">${l.subject}</div>
          <h2>${l.title}</h2>
          <p>${l.description}</p>
          <span class="btn${l.available ? '' : ' ghost'}">${l.available ? 'Start →' : 'Soon…'}</span>`;
        coursesEl.appendChild(el);
      }
    }
    renderFilter();
    renderCourses();
  </script>
</body>
</html>
