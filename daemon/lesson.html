<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson | Daemon</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">
  <link rel="stylesheet" href="../styles.css">
  <script>
    // Set the theme before rendering (no flash)
    try { var t = localStorage.getItem('lerncenter-theme'); } catch (e) {}
    document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
</head>
<body class="daemon">
  <div id="app"></div>
  <script type="module">
    import { lessons } from './lessons/index.js';
    import { mountLesson } from '../js/lesson.js';
    const id = new URLSearchParams(location.search).get('id') || 'harmonic-shift';
    const load = lessons[id];
    if (!load) {
      document.getElementById('app').innerHTML = '<main class="lesson"><h1>Lesson not found</h1><p><a href="index.html">Back to overview</a></p></main>';
    } else {
      load().then((m) => mountLesson(m.default, { brand: 'Daemon', tag: m.default.subject }));
    }
  </script>
</body>
</html>
